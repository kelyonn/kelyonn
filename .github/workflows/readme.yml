name: refresh profile

on:
  schedule:
    - cron: "23 * * * *"   # hourly, off the top of the hour to dodge queue congestion
  workflow_dispatch:        # Actions tab -> Run workflow
  repository_dispatch:      # instant trigger, see README-SETUP.md
    types: [refresh]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate banners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh profile banners"
          git push

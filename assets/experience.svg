<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 938" width="1280" height="938" role="img" aria-label="Experience. Devsper, co-founder, Feb to Oct 2026. CIE PES University, project intern, Jun to Jul 2026. Appex, club head, 2025 to 2026. Samarpana, PR and campaigning head, 2025 to 2026. PES University, B.Tech computer science, 2023 to 2027."><style>@font-face{font-family:S;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:MB;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}.fb{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style><defs></defs><rect width="1280" height="938" fill="#1c1815"/><text x="60.0" y="80.0" font-family="S" font-size="52" fill="#f2ebe3" text-anchor="start" letter-spacing="0" >Experience</text><line x1="60" y1="104" x2="1220" y2="104" stroke="#3a322c"/><text x="60.0" y="150.0" font-family="MB" font-size="15" fill="#f2ebe3" text-anchor="start" letter-spacing="2" >DEVSPER</text><text x="60.0" y="174.0" font-family="M" font-size="14" fill="#e8553d" text-anchor="start" letter-spacing="0" >Co-founder</text><text x="60.0" y="196.0" font-family="M" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="0" >Feb – Oct 2026</text><text x="420.0" y="150.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Ran marketing, operations and go-to-market for an AI workflow-automation startup.</text><text x="420.0" y="174.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Shaped the core product: client-scoped context packs with human approval gates.</text><text x="420.0" y="198.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Mapped 13 competitors to define the category and ideal customer, and built the</text><text x="420.0" y="222.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >investor pitch and VC outreach.</text><line x1="60" y1="268" x2="1220" y2="268" stroke="#3a322c"/><text x="60.0" y="308.0" font-family="MB" font-size="15" fill="#f2ebe3" text-anchor="start" letter-spacing="2" >CIE, PES UNIVERSITY</text><text x="60.0" y="332.0" font-family="M" font-size="14" fill="#e8553d" text-anchor="start" letter-spacing="0" >Project intern</text><text x="60.0" y="354.0" font-family="M" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="0" >Jun – Jul 2026</text><text x="420.0" y="308.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Co-built SentinelEdge, a zero-trust edge-AI traffic platform where every camera</text><text x="420.0" y="332.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >reading is signed and anchored on a private blockchain. Built its Merkle</text><text x="420.0" y="356.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >tamper-evidence auditor, provenance receipts that can be verified offline, and a</text><text x="420.0" y="380.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Bengaluru digital twin with 1,377 real signals.</text><line x1="60" y1="426" x2="1220" y2="426" stroke="#3a322c"/><text x="60.0" y="466.0" font-family="MB" font-size="15" fill="#f2ebe3" text-anchor="start" letter-spacing="2" >APPEX, PES UNIVERSITY</text><text x="60.0" y="490.0" font-family="M" font-size="14" fill="#e8553d" text-anchor="start" letter-spacing="0" >Club head</text><text x="60.0" y="512.0" font-family="M" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="0" >2025 – 2026</text><text x="420.0" y="466.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Led the university&#x27;s tech club and directed Horcrux 2.0, a 24-hour state-level</text><text x="420.0" y="490.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >hackathon, with a 120+ member team across seven functions. Also ran Survivor</text><text x="420.0" y="514.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Island, a DSA challenge built to mirror real interviews.</text><line x1="60" y1="560" x2="1220" y2="560" stroke="#3a322c"/><text x="60.0" y="600.0" font-family="MB" font-size="15" fill="#f2ebe3" text-anchor="start" letter-spacing="2" >SAMARPANA, PES UNIVERSITY</text><text x="60.0" y="624.0" font-family="M" font-size="14" fill="#e8553d" text-anchor="start" letter-spacing="0" >PR and campaigning head</text><text x="60.0" y="646.0" font-family="M" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="0" >2025 – 2026</text><text x="420.0" y="600.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Led a 40-member team for a student initiative supporting families of Indian</text><text x="420.0" y="624.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >martyrs, across events drawing 8,000–10,000 people. Grew the handle by 1,200+</text><text x="420.0" y="648.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >followers and sold out Raas-Leher, the flagship Garba night, at about 3,000 people</text><text x="420.0" y="672.0" font-family="M" font-size="15" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >a day.</text><line x1="60" y1="718" x2="1220" y2="718" stroke="#3a322c"/><text x="60.0" y="758.0" font-family="MB" font-size="15" fill="#f2ebe3" text-anchor="start" letter-spacing="2" >PES UNIVERSITY</text><text x="60.0" y="782.0" font-family="M" font-size="14" fill="#e8553d" text-anchor="start" letter-spacing="0" >B.Tech, Computer Science and Engineering</text><text x="60.0" y="804.0" font-family="M" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="0" >2023 – 2027</text><line x1="60" y1="828" x2="1220" y2="828" stroke="#3a322c"/><text x="60.0" y="898.0" font-family="MB" font-size="13" fill="#e8553d" text-anchor="start" letter-spacing="3" >RECOGNITION</text><text x="220.0" y="898.0" font-family="M" font-size="14" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >3rd place, Epoch 2.0 datathon  ·  Nominated team, Smart India Hackathon 2024</text></svg>
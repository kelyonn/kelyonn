<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="Liner notes. I like building the layer underneath: the runtime under the container, the consensus under the database, the engine under the model. Co-founding devsper, building AI workflow automation, and studying computer science at PES University in Bengaluru. Languages: Go, Rust, Python, C, TypeScript. Data: Postgres, Redis, Kafka, TimescaleDB. ML: PyTorch, scikit-learn, YOLO, ONNX. Infrastructure: Docker, Kubernetes, Terraform, gRPC."><style>@font-face{font-family:S;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:MB;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}.fb{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style><defs></defs><rect width="1280" height="620" fill="#1c1815"/><text x="60.0" y="80.0" font-family="S" font-size="52" fill="#f2ebe3" text-anchor="start" letter-spacing="0" >About me</text><line x1="60" y1="104" x2="1220" y2="104" stroke="#3a322c"/><text x="60.0" y="150.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >I build from first principles: a container runtime from</text><text x="60.0" y="176.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >Linux namespaces up, Raft straight from the paper, an LLM</text><text x="60.0" y="202.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >inference engine with no PyTorch, and a ledger where every</text><text x="60.0" y="228.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >reading is signed and chained. I&#x27;d rather understand the</text><text x="60.0" y="254.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >layer underneath than wrap it.</text><text x="60.0" y="280.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" ></text><text x="60.0" y="306.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >In 2026 I co-founded devsper, an AI workflow-automation</text><text x="60.0" y="332.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >startup. I ran marketing, operations and go-to-market, and</text><text x="60.0" y="358.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >shaped the product&#x27;s core idea: client-scoped context packs</text><text x="60.0" y="384.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >with human approval gates.</text><text x="60.0" y="410.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" ></text><text x="60.0" y="436.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >My capstone is an evidence-first drug-interaction explainer.</text><text x="60.0" y="462.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >DrugBank decides the verdict, a graph neural network predicts</text><text x="60.0" y="488.0" font-family="M" font-size="16" fill="#d8cfc5" text-anchor="start" letter-spacing="0" >what isn&#x27;t documented (ROC-AUC 0.945), and the LLM only explains.</text><text x="760.0" y="150.0" font-family="MB" font-size="13" fill="#e8553d" text-anchor="start" letter-spacing="3" >TECH STACK</text><text x="760.0" y="190.0" font-family="MB" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="1" >Languages</text><text x="760.0" y="212.0" font-family="M" font-size="16" fill="#f2ebe3" text-anchor="start" letter-spacing="0" >Python, Go, Rust, C, TypeScript, Swift, SQL</text><text x="760.0" y="242.0" font-family="MB" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="1" >Systems</text><text x="760.0" y="264.0" font-family="M" font-size="16" fill="#f2ebe3" text-anchor="start" letter-spacing="0" >namespaces, cgroups v2, seccomp, Raft, Kubernetes</text><text x="760.0" y="294.0" font-family="MB" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="1" >Machine learning</text><text x="760.0" y="316.0" font-family="M" font-size="16" fill="#f2ebe3" text-anchor="start" letter-spacing="0" >PyTorch, GNNs, RAG, YOLO, constrained decoding</text><text x="760.0" y="346.0" font-family="MB" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="1" >Security</text><text x="760.0" y="368.0" font-family="M" font-size="16" fill="#f2ebe3" text-anchor="start" letter-spacing="0" >ECC secp256k1, Merkle trees, zero trust, Besu</text><text x="760.0" y="398.0" font-family="MB" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="1" >Product</text><text x="760.0" y="420.0" font-family="M" font-size="16" fill="#f2ebe3" text-anchor="start" letter-spacing="0" >go-to-market, ICP, positioning, investor pitch</text><line x1="60" y1="550" x2="1220" y2="550" stroke="#3a322c"/><text x="60.0" y="584.0" font-family="M" font-size="13" fill="#8a7c6f" text-anchor="start" letter-spacing="0" >Based in Bengaluru. Computer science at PES University.</text></svg>